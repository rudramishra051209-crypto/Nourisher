    <!-- Google Identity Services (GIS) for Google Sheets OAuth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('nourish_theme');
          var isDark = saved ? saved === 'dark' : false;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F6F9] dark:bg-[#090B10] text-slate-900 dark:text-[#F1F5F9] antialiased selection:bg-[#CCFF00] selection:text-[#090B10] transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
